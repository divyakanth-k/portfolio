repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=2048']
      - id: check-merge-conflict

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        exclude: package.json.lock

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [html, css, javascript]
        args: ['--prose-wrap=always', '--print-width=120']

  - repo: local
    hooks:
      - id: generate-sitemap
        name: Generate Dynamic Sitemap
        entry: python3 scripts/generate_sitemap.py
        language: system
        pass_filenames: false
        always_run: true
